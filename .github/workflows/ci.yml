# Security-sensitive project: keep the third-party supply chain minimal. See
# docs/devops.md ("Continuous integration").
#   - Only actions/* and golangci/golangci-lint-action, each pinned to a full
#     commit SHA (version in the trailing comment).
#   - TinyGo is downloaded from the official release by scripts/install-tinygo.sh
#     and verified against the SHA-256 pinned in tools.env.
#   - Go comes from go.mod; Node dependencies from package-lock.json.
#   - No secrets, read-only token, no deploy step.
# CI runs the same `make` targets a developer runs locally. `make ci` is the
# local equivalent of all jobs below; here it is split into parallel jobs, each
# calling a subset of the same targets, so wall time is the slowest job rather
# than the sum. Toolchain setup lives in .github/actions/setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint: "true"
      - run: make fmt-check tidy-check vet lint

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test coverage

  size:
    name: Wasm size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tinygo: "true"
      - run: make size

  e2e:
    name: E2E (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # `dev` builds with DEV_TAGS, `prod` with no tags. See docs/devops.md.
        include:
          - build: dev
            target: test-e2e
          - build: prod
            target: test-e2e-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          tinygo: "true"
      - run: make ${{ matrix.target }}
