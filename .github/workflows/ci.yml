# Security-sensitive project: keep the third-party supply chain minimal. See
# docs/devops.md ("Continuous integration").
#   - Only actions/* and golangci/golangci-lint-action, each pinned to a full
#     commit SHA (version in the trailing comment).
#   - The Worker is built once, in the `build` job, and handed to `size` and
#     `e2e` as a workflow artifact. Artifacts are scoped to a single run, so
#     unlike a cache a pull request cannot plant one for another run to use.
#   - TinyGo is downloaded from the official release by scripts/install-tinygo.sh
#     and verified against the SHA-256 pinned in tools.env.
#   - Go comes from go.mod; Node dependencies from package-lock.json.
#   - No secrets, read-only token, no deploy step.
# CI runs the same `make` targets a developer runs locally. `make ci` is the
# local equivalent of all jobs below; here it is split into parallel jobs, each
# calling a subset of the same targets, so wall time is the slowest job rather
# than the sum. Locally `make` shares one build/ between `size` and `test-e2e`;
# here `build` produces it and the other two download it. Toolchain setup lives
# in .github/actions/setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint: "true"
      - run: make fmt-check tidy-check vet lint

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: make test coverage

  # The only job that needs TinyGo. Everything TinyGo produces is built here once
  # (the wasm and its `-size full` report) and shared as the `worker-build`
  # artifact, so size and e2e start without installing or running it.
  build:
    name: Build Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
          tinygo: "true"
      - run: make build build/size-full.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  size:
    name: Wasm size
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: build/
      # PREBUILT makes make fail rather than rebuild if build/ looks stale (this
      # job has no TinyGo). Downloaded files are newer than the checkout, so it
      # normally never triggers.
      - run: make size PREBUILT=1

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: build/
      - run: make test-e2e PREBUILT=1

  # The single required status check on `main`. It depends on every other job,
  # so adding a job above only requires adding it to `needs` here, not changing
  # branch protection. `always()` makes it run (and fail) even when a needed job
  # failed or was cancelled; a skipped job also counts as a failure.
  ci:
    name: CI
    if: always()
    needs: [lint, test, build, size, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          # Space-separated results of every job in `needs`.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || { echo "::error::no job results"; exit 1; }
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job finished with result: $r"
              exit 1
            fi
          done
