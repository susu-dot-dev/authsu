            - pkg: github.com/susu-dot-dev/authsu/internal/app
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/registration
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/login
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/session
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/firstrun
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/invitations
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/users
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/agents
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/keys
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
            - pkg: github.com/susu-dot-dev/authsu/internal/oauth
              desc: "a feature imports only auth, store, input and the foundation: never another feature, and never app"
        only-the-worker-imports-app:
          files:
            - "$all"
            - "!**/cmd/worker/**"
            - "!**/internal/app/**"
          deny:
            - pkg: github.com/susu-dot-dev/authsu/internal/app
              desc: "only cmd/worker imports internal/app, the top layer"
        database-driver-only-in-the-worker:
          files:
            - "$all"
            - "!**/cmd/worker/**"
            # The one test-side exception: e2e/db_test.go prepares and reads back
            # the state of the Worker's database. TestDatabaseIsOnlyOpenedHere
            # fails if any other e2e file opens a database.
            - "!**/e2e/db_test.go"
          deny:
            - pkg: database/sql
              desc: "Go product code has no *sql.DB; every statement goes through store.Exec, which only cmd/worker implements"
            - pkg: github.com/syumai/workers-go
              desc: "the D1 driver and the Workers runtime exist only in js/wasm, so only cmd/worker imports them"
        test-packages-stay-in-tests:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: testing
              desc: "test code lives in _test.go files only (and testing must never be linked into the Worker)"
            - pkg: net/http/httptest
              desc: "test code lives in _test.go files only (and httptest must never be linked into the Worker)"
    gomoddirectives:
      # The only permitted replace: the workers-go fork carrying D1 batch
      # support until it is merged upstream. Any other replace fails the lint.
      replace-allow-list:
        - github.com/syumai/workers-go
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      # Internal tests must be named *_internal_test.go so that needing
      # package-private access is a visible, deliberate exception.
      skip-regexp: (export|internal)_test\.go

  exclusions:
    rules:
      # The e2e harness is test tooling that, by design, launches `npx`
      # (G204) and clears a state directory named by an env var (G703). Its
      # inputs come from the Makefile and the developer's environment, never
      # from a request.
      - path: ^e2e/
        linters:
          - gosec

formatters:
  enable: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
