# golangci-lint v2 configuration. See docs/CONTRIBUTING.md.
#
# Posture: maximal. Every linter is enabled and the ones below are disabled one
# by one, each with the reason. Formatting is `gofmt -s` (make fmt), not a
# golangci-lint formatter.
version: "2"

run:
  timeout: 5m

linters:
  default: all
  disable:
    # Deprecated: replaced by the maintained *_v2/_v5 linters, which
    # `default: all` enables.
    - exhaustruct
    - gomodguard
    - wsl
    # Whitespace-placement opinions beyond what gofmt and `whitespace` enforce.
    - wsl_v5
    - nlreturn
    # Forces every struct literal to name every field; painful for Deps,
    # config structs and table-driven tests where zero values are intended.
    - exhaustruct_v5
    # Bans returning interfaces; conflicts with idiomatic constructors such as
    # NewHandler returning http.Handler.
    - ireturn
    # Rejects idiomatic short names (w, r, db, tt) unless tuned per name.
    - varnamelen
  settings:
    depguard:
      # The layering of docs/ARCHITECTURE.md as rules. Imports flow downward only:
      #   app > features > auth > store > input > foundation
      # and feature packages never import each other. Each rule lists the
      # packages of one layer in `files` and the layers above or beside it in
      # `deny`, so a forbidden import fails the lint at the line that adds it.
      # `files` globs are matched against absolute paths, hence the leading
      # **; "$test" is every _test.go file. Add a new package to its layer's
      # `files` (a feature also gets its own rule and an entry in every other
      # feature's `deny`).
      rules:
        foundation:
          files:
            - "**/internal/result/**"
            - "**/internal/apierr/**"
            - "**/internal/httpapi/**"
            - "**/internal/webauthn/**"
            - "**/internal/challenge/**"
            - "**/internal/config/**"
            - "**/internal/scope/**"
            - "**/internal/secret/**"
            - "**/internal/seal/**"
            - "**/internal/resource/**"
            - "**/internal/jws/**"
            - "**/internal/fetch/**"
          deny:
            - pkg: github.com/susu-dot-dev/authsu/internal/input
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/store
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/auth
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/app
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/registration
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/login
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/session
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/firstrun
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/invitations
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/users
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/agents
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/keys
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/oauth
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
            - pkg: github.com/susu-dot-dev/authsu/internal/orgs
              desc: "foundation packages are the lowest layer and import nothing above it: no input, store, auth, feature or app"
        input:
